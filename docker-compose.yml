services:
  postgres:
    image: postgres:16
    container_name: covoiturage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
    # 5433 sur l'hôte pour éviter le conflit avec un PostgreSQL déjà présent sur 5432
    # Si tu utilises CE conteneur, lance l'app avec :
    #   DB_URL=jdbc:postgresql://localhost:5433/covoiturage_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d covoiturage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
