spring.application.name=Covoiturage

# PostgreSQL (docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/covoiturage_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# Creation automatique des tables dans pgAdmin via Hibernate
# update = cree les tables/colonnes manquantes sans supprimer les donnees
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Les donnees (data.sql) sont inserees APRES la creation du schema par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# 8081 pour éviter le conflit avec Jenkins (8080) sur cette machine
server.port=${SERVER_PORT:8081}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.covoiturage=INFO
